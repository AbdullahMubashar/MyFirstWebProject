<html lang="en">
<head>
  <title>Task 3</title>
</head>
<body style="background-color:silver;font-family:'Times New Roman', serif;">
<h1 style="text-align:center; color:red;">Continental Hotel Reservation</h1>
<form>
  <table style="background-color: lightblue; border: 7px ridge black;margin-left:auto;margin-right:auto;border-collapse: collapse;font-size:20px;width:30%;">
    <tr>
      <td style="border:5px ridge black;width:30%;text-align:right;">
        <label for="name"><b>Name</b></label>
      </td>
      <td style="border:5px ridge black;">
        <input id="name" style="border:1px solid black;width:80%;" type="text" placeholder="Enter Your Name">
      </td>
    </tr>
    <tr>
      <td style="border:5px ridge black;width:30%;text-align:right;">
        <label for="mail"><b>E-Mail</b></label>
      </td>
      <td style="border:5px ridge black;">
        <input id="mail" style="border:1px solid black;width:80%;" type="text" placeholder="Enter Your Email">
      </td>
    </tr>
    <tr>
      <td style="border:5px ridge black;width:30%;text-align:right;"
        <label for="number"><b>Mobile No.</b></label>
      </td>
      <td style="border:5px ridge black;">
        <input id="number" style="border:1px solid black;width:80%;" type="text" placeholder="Enter Your Cell Number">
      </td>
    </tr>
    <tr>
      <td style="border:5px ridge black;width:30%;text-align:right;">
        <label for="time"><b>Arrival</b></label>
      </td>
      <td style="border:5px ridge black;">
        <input id="time" style="border:1px solid black;width:80%;" type="time" placeholder="Enter Your Arrival Time">
      </td>
    </tr>
    <tr>
      <td style="border:5px ridge black;width:30%;text-align:right;">
        <label for="depart"><b>Departure</b></label>
        <label for="depart2"></label>
      </td>
      <td style="border:5px ridge black;">
        <input id="depart" style="border:1px solid black;width:48%;" type="text">
        <input id="depart2" style="border:1px solid black;width:48%;" type="text">
      </td>
    </tr>
    <tr>
      <td style="border:5px ridge black;width:30%;text-align:right;">
        <label><b>Room Type</b></label>
      </td>
      <td style="border:5px ridge black;">
        <input id="option1" type="radio">
        <label for="option1">Single</label>
        <input id="option2" type="radio">
        <label for="option2">Double</label><br>
        <input id="option3" type="radio">
        <label for="option3">Presidential Suite</label>
      </td>
    </tr>
    <tr>
      <td style="border:5px ridge black;width:30%;text-align:right;">
        <label><b>Preferences</b></label>
      </td>
      <td style="border:5px ridge black;">
        <input id="o1" type="checkbox">
        <label for="o1">Non-Smoking</label><br>
        <input id="o2" type="checkbox">
        <label for="o2">Internet</label><br>
        <input id="o3" type="checkbox">
        <label for="o3">Firm Mattress</label>
      </td>
    </tr>
    <tr>
      <td style="border:5px ridge black;width:30%;text-align:right;">
        <label><b>Mode of Payment</b></label>
      </td>
      <td style="border:5px ridge black;">
        <input id="op1" type="checkbox">
        <label for="op1">Cash</label>
        <input id="op2" type="checkbox">
        <label for="op2">Check</label><br>
        <input id="op3" type="checkbox">
        <label for="op3">Credit Card</label>
        <input type="submit" value="Select Card" style="width:35%;">
      </td>
    </tr>
    <tr>
      <td colspan="2" style="border:5px ridge black;text-align: center;">
        <input type="submit" value="Send Data" style="width:30%;">
      </td>
    </tr>
  </table>
</form>
</body>
</html>
